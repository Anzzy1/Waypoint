<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waypoint — Developer Roadmaps</title>
    <meta name="description" content="Free, step-by-step developer roadmaps with lessons, curated videos and a progress checklist." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101314" media="(prefers-color-scheme: dark)" />
    <!-- share preview (LinkedIn, X, Slack…); image + URL tags are added at build time from VITE_SITE_URL -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Waypoint" />
    <meta property="og:title" content="Waypoint — Free Developer Roadmaps" />
    <meta property="og:description" content="Step-by-step roadmaps for 10 developer roles, with short lessons, hand-picked videos, real projects and progress tracking. 100% free." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <script>
      // apply saved theme before paint to avoid a flash
      try { var t = localStorage.getItem('waypoint.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
