<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waypoint Thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#333; padding:40px; font-family:'Schibsted Grotesk', system-ui, sans-serif; }
  .frame { position:relative; width:1280px; height:720px; overflow:hidden;
    background:radial-gradient(ellipse 60% 70% at 50% 42%, #133524 0%, #0c1712 55%, #080b0a 100%); color:#fff; }
  .frame::before { content:""; position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,.09) 1.2px, transparent 1.2px); background-size:32px 32px;
    -webkit-mask-image:radial-gradient(ellipse 75% 75% at 50% 45%, #000 20%, transparent 80%); mask-image:radial-gradient(ellipse 75% 75% at 50% 45%, #000 20%, transparent 80%); }

  svg.path { position:absolute; inset:0; }

  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding-bottom:20px; }
  .icon { width:150px; height:150px; border-radius:38px; filter:drop-shadow(0 0 60px rgba(127,212,154,.35)) drop-shadow(0 24px 40px rgba(0,0,0,.5)); }
  h1 { margin-top:34px; font-size:150px; line-height:.9; font-weight:900; letter-spacing:-.05em; }
  .dr { margin-top:24px; display:flex; align-items:center; gap:22px; font:700 30px 'JetBrains Mono', monospace; letter-spacing:.34em; color:#7fd49a; padding-left:.34em; }
  .dr i { display:block; width:56px; height:2px; background:linear-gradient(90deg, transparent, #7fd49a); }
  .dr i:last-child { background:linear-gradient(90deg, #7fd49a, transparent); }
  .pills { margin-top:40px; display:flex; gap:12px; }
  .pill { padding:11px 20px; border-radius:999px; border:1px solid rgba(127,212,154,.28); background:rgba(127,212,154,.08);
    font:600 20px 'Schibsted Grotesk', sans-serif; color:#d6efe0; }
  .pill b { color:#7fd49a; }
</style>
</head>
<body>
<section class="frame" data-name="thumbnail">
  <!-- decorative roadmap path behind the title -->
  <svg class="path" viewBox="0 0 1280 720">
    <defs>
      <linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#1f9d5c" stop-opacity="0"/><stop offset=".25" stop-color="#1f9d5c" stop-opacity=".9"/><stop offset=".75" stop-color="#7fd49a" stop-opacity=".9"/><stop offset="1" stop-color="#7fd49a" stop-opacity="0"/></linearGradient>
    </defs>
    <path d="M-20 620 C 100 620, 130 540, 190 540 S 290 640, 430 660 M830 640 C 950 610, 980 470, 1060 300 S 1200 120, 1300 120"
          fill="none" stroke="url(#pg)" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 14"/>
    <path d="M-20 140 C 120 140, 160 250, 230 250" fill="none" stroke="#1f9d5c" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 12"/>
    <!-- waypoints -->
    <g fill="#0c1712" stroke-width="4">
      <circle cx="190" cy="540" r="11" stroke="#1f9d5c"/>
      <circle cx="1060" cy="300" r="11" stroke="#7fd49a"/>
    </g>
    <circle cx="190" cy="540" r="4" fill="#1f9d5c"/>
    <circle cx="1060" cy="300" r="26" fill="#7fd49a" opacity=".15"/>
    <circle cx="1060" cy="300" r="5" fill="#7fd49a"/>
    <circle cx="230" cy="250" r="6" fill="#1f9d5c" opacity=".5"/>
  </svg>

  <div class="center">
    <svg class="icon" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#000"/><rect x=".5" y=".5" width="31" height="31" rx="7.5" fill="none" stroke="#2a3a31"/><path d="M9 23V16a4 4 0 0 1 4-4h6a4 4 0 0 0 4-4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="9" cy="23" r="2.6" fill="#fff"/><circle cx="23" cy="8" r="2.6" fill="#7fd49a"/></svg>
    <h1>Waypoint</h1>
    <div class="dr"><i></i>DEVELOPER ROADMAP<i></i></div>
    <div class="pills">
      <span class="pill"><b>8</b> career paths</span>
      <span class="pill"><b>72</b> lessons</span>
      <span class="pill"><b>100%</b> free</span>
    </div>
  </div>
</section>
</body>
</html>
