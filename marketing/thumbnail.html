<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waypoint Thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0b0f10; --muted:#66717a; --soft:#9aa3a9; --line:#e5e9eb; --green:#1f9d5c; --deep:#1f6b45; --mint:#7fd49a; --tint:#eaf6ef; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#ccc; padding:40px; font-family:'Schibsted Grotesk', system-ui, sans-serif; color:var(--ink); }
  .frame { position:relative; width:1280px; height:720px; overflow:hidden; background:#fff; }
  .frame::before { content:""; position:absolute; inset:0;
    background-image:radial-gradient(#d3d9dd 1.2px, transparent 1.2px); background-size:28px 28px;
    -webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, #000 30%, transparent 85%); mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, #000 30%, transparent 85%); }
  .glow { position:absolute; border-radius:50%; }
  .g1 { width:620px; height:620px; left:330px; top:-120px; background:radial-gradient(circle, rgba(127,212,154,.38), rgba(127,212,154,0) 65%); }
  .g2 { width:420px; height:420px; left:-140px; bottom:-180px; background:radial-gradient(circle, rgba(31,157,92,.16), rgba(31,157,92,0) 65%); }
  .g3 { width:420px; height:420px; right:-140px; top:-160px; background:radial-gradient(circle, rgba(31,157,92,.14), rgba(31,157,92,0) 65%); }
  svg.path { position:absolute; inset:0; }

  .center { position:absolute; left:0; right:0; top:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding-bottom:10px; z-index:2; }
  .icon { width:118px; height:118px; filter:drop-shadow(0 18px 30px rgba(11,15,16,.22)) drop-shadow(0 0 40px rgba(127,212,154,.45)); }
  h1 { margin-top:26px; font-size:132px; line-height:.9; font-weight:900; letter-spacing:-.05em; }
  .dr { margin-top:20px; display:flex; align-items:center; gap:18px; font:700 25px 'JetBrains Mono', monospace; letter-spacing:.34em; color:var(--green); padding-left:.34em; }
  .dr i { display:block; width:46px; height:2px; background:linear-gradient(90deg, transparent, var(--green)); }
  .dr i:last-child { background:linear-gradient(90deg, var(--green), transparent); }
  .pills { margin-top:32px; display:flex; gap:10px; }
  .pill { padding:10px 18px; border-radius:999px; border:1px solid var(--line); background:#fff; box-shadow:0 6px 16px rgba(11,15,16,.06);
    font:600 18px 'Schibsted Grotesk', sans-serif; color:var(--ink); }
  .pill b { color:var(--green); }
  .pill.dark { background:var(--ink); color:#fff; border-color:var(--ink); }
  .pill.dark b { color:var(--mint); }

  /* side cards */
  .card { position:absolute; z-index:3; background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px 16px;
    box-shadow:0 18px 40px -12px rgba(11,15,16,.18); transform:rotate(var(--r,0deg)); }
  .lbl { font:700 11px 'JetBrains Mono', monospace; letter-spacing:.12em; color:var(--soft); text-transform:uppercase; }
  .row { display:flex; align-items:center; gap:10px; margin-top:8px; font-size:17px; font-weight:700; }
  .dot { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font:700 11px 'JetBrains Mono', monospace; flex:none; }
  .dot.done { background:var(--green); color:#fff; }
  .dot.now { border:2px solid var(--green); color:var(--green); box-shadow:0 0 0 4px var(--tint); }
  .dot.next { border:2px solid #d5dadd; color:var(--soft); }
  .row.dim { color:#8a949a; font-weight:600; }
  .tag { margin-left:auto; font:700 10px 'JetBrains Mono', monospace; color:var(--deep); background:var(--tint); padding:4px 7px; border-radius:6px; letter-spacing:.06em; }
  .big { font-size:20px; font-weight:800; margin-top:6px; white-space:nowrap; }
  .big em { font-style:normal; color:var(--green); }
  .bar { margin-top:10px; height:7px; border-radius:9px; background:#edf0f2; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:9px; background:linear-gradient(90deg, var(--green), var(--mint)); }
  .badge { display:flex; align-items:center; gap:12px; }
  .badge .medal { width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg, #7fd49a, #1f9d5c); display:grid; place-items:center; color:#fff; font-size:20px; }
  .badge b { display:block; font-size:16px; }
  .badge span { display:block; font-size:13px; color:var(--muted); margin-top:2px; }

  .logo { position:absolute; z-index:3; width:54px; height:54px; border-radius:15px; background:#fff; border:1px solid var(--line);
    box-shadow:0 10px 24px -6px rgba(11,15,16,.16); display:grid; place-items:center; transform:translate(-50%,-50%) rotate(var(--r,0deg)); }
  .logo img { width:28px; height:28px; }
  .spark { position:absolute; z-index:1; color:var(--mint); font-size:22px; transform:translate(-50%,-50%); }
</style>
</head>
<body>
<section class="frame" data-name="thumbnail">
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

  <svg class="path" viewBox="0 0 1280 720">
    <defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#1f9d5c" stop-opacity="0"/><stop offset=".2" stop-color="#1f9d5c" stop-opacity=".7"/><stop offset=".8" stop-color="#7fd49a" stop-opacity=".9"/><stop offset="1" stop-color="#7fd49a" stop-opacity="0"/></linearGradient></defs>
    <path d="M-20 660 C 120 660, 150 560, 250 560 S 380 690, 470 700" fill="none" stroke="url(#pg)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 12"/>
    <path d="M810 30 C 900 40, 960 120, 1040 130 S 1200 60, 1300 70" fill="none" stroke="url(#pg)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 12"/>
  </svg>

  <!-- left side info -->
  <div class="card" style="left:56px; top:118px; width:250px; --r:-3deg">
    <div class="lbl">Frontend · Stage 3 of 5</div>
    <div class="row"><span class="dot done">✓</span>HTML &amp; CSS</div>
    <div class="row"><span class="dot now">03</span>JavaScript<span class="tag">NOW</span></div>
    <div class="row dim"><span class="dot next">04</span>React</div>
  </div>
  <div class="card badge" style="left:78px; top:420px; --r:2deg">
    <div class="medal">★</div><div><b>Badge unlocked</b><span>First project shipped</span></div>
  </div>

  <!-- right side info -->
  <div class="card" style="right:50px; top:150px; width:282px; --r:3deg">
    <div class="lbl">Your plan · 6 hrs/week</div>
    <div class="big">Finish around <em>Aug 2027</em></div>
    <div class="bar"><i style="width:42%"></i></div>
  </div>
  <div class="card" style="right:70px; top:440px; width:220px; --r:-2deg">
    <div class="lbl">Stage project</div>
    <div class="big" style="font-size:18px">Build a landing page</div>
    <div class="bar"><i style="width:100%"></i></div>
  </div>

  <!-- tech logos -->
  <div class="logo" style="left:118px; top:330px; --r:-8deg"><img src="https://cdn.simpleicons.org/react"></div>
  <div class="logo" style="left:300px; top:620px; --r:6deg"><img src="https://cdn.simpleicons.org/javascript"></div>
  <div class="logo" style="left:1150px; top:345px; --r:8deg"><img src="https://cdn.simpleicons.org/python"></div>
  <div class="logo" style="left:990px; top:640px; --r:-6deg"><img src="https://cdn.simpleicons.org/nodedotjs"></div>
  <div class="logo" style="left:1210px; top:620px; --r:5deg"><img src="https://cdn.simpleicons.org/docker"></div>
  <div class="logo" style="left:60px; top:620px; --r:-5deg"><img src="https://cdn.simpleicons.org/git"></div>

  <span class="spark" style="left:350px; top:120px">✦</span>
  <span class="spark" style="left:940px; top:250px; font-size:16px">✦</span>
  <span class="spark" style="left:330px; top:520px; font-size:14px; color:#1f9d5c">✦</span>
  <span class="spark" style="left:920px; top:560px">✦</span>

  <div class="center">
    <svg class="icon" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0b0f10"/><path d="M9 23V16a4 4 0 0 1 4-4h6a4 4 0 0 0 4-4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="9" cy="23" r="2.6" fill="#fff"/><circle cx="23" cy="8" r="2.6" fill="#7fd49a"/></svg>
    <h1>Waypoint</h1>
    <div class="dr"><i></i>DEVELOPER ROADMAP<i></i></div>
    <div class="pills">
      <span class="pill"><b>10</b> career paths</span>
      <span class="pill"><b>93</b> lessons</span>
      <span class="pill dark"><b>100%</b> free</span>
    </div>
  </div>
</section>
</body>
</html>
